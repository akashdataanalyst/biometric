# Biometric machines (eSSL / ZKTeco ADMS, Hikvision) usually speak plain HTTP only.
# This extra server block opens HTTP port 8081 ONLY for the machine paths.
#
# 1. Replace erp.yourcompany.com with your ERPNext site name (folder name in sites/).
# 2. Check the upstream: in /etc/nginx/conf.d/frappe-bench.conf look for
#    "upstream frappe-bench-frappe { server 127.0.0.1:8000 ... }" and use the same address.
# 3. sudo cp nginx-biometric.conf /etc/nginx/conf.d/ && sudo nginx -t && sudo systemctl reload nginx
# 4. AWS Security Group: allow inbound TCP 8081.
# 5. Biometric Settings > Port for Machines = 8081

server {
	listen 8081;
	server_name _;

	location ~ ^/(iclock|biometric)/ {
		proxy_pass http://127.0.0.1:8000;
		proxy_http_version 1.1;
		proxy_set_header X-Frappe-Site-Name erp.yourcompany.com;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_read_timeout 120;
		client_max_body_size 20m;
	}

	location / {
		return 404;
	}
}

