[project]
name = "biometric_integration"
authors = [{ name = "Calco", email = "mis.1@calco.in" }]
description = "Universal biometric / punching machine integration for ERPNext HRMS (eSSL, ZKTeco, Hikvision, any device via webhook, LAN agent or file import) with a built-in device simulator"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
